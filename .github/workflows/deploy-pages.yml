name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push cancel a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Quality gate: never deploy code that fails typecheck, lint, or tests.
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

      # The frontend bakes VITE_* values in at build time, so they must be
      # present here. All are safe to expose in a browser bundle: the Supabase
      # anon key is protected by row-level security, and the media index URL is
      # a time-limited presigned link.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CESIUM_ION_TOKEN: ${{ secrets.VITE_CESIUM_ION_TOKEN }}
          VITE_AI_PROXY_URL: ${{ secrets.VITE_AI_PROXY_URL }}
          VITE_B2_PUBLIC_BASE: ${{ secrets.VITE_B2_PUBLIC_BASE }}
          VITE_MEDIA_INDEX_URL: ${{ secrets.VITE_MEDIA_INDEX_URL }}
        run: npm run build

      # Pages serves static files with no SPA rewrite, so a hard load of
      # /world would 404. Serving index.html as the 404 page lets the client
      # router take over and resolve the route.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      # Stop Pages running the output through Jekyll, which ignores paths
      # beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
