name: Monthly World Sync

on:
  # Runs at 00:00 UTC on the 1st of every month
  schedule:
    - cron: '0 0 1 * *'

  # Allow manual trigger from the Actions tab for testing
  workflow_dispatch:
    inputs:
      country_code:
        description: 'Single country code to test (e.g. IND). Leave blank to sync all.'
        required: false
        default: ''
      world_id:
        description: 'World ID (default: live)'
        required: false
        default: 'live'

permissions:
  contents: read

# One sync at a time; a second trigger waits rather than double-applying corrections.
concurrency:
  group: monthly-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync countries
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 195 countries × ~30s each (news + LLM) = ~97 min worst case

    # Inputs reach the shell only through env vars (never ${{ }} inside run:),
    # and are validated before use.
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      INPUT_COUNTRY: ${{ inputs.country_code }}
      INPUT_WORLD: ${{ inputs.world_id }}

    steps:
      - name: Validate inputs
        id: inputs
        run: |
          set -euo pipefail
          WORLD="${INPUT_WORLD:-live}"
          CODE="$(printf '%s' "${INPUT_COUNTRY:-}" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"

          if ! [[ "$WORLD" =~ ^(live|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$ ]]; then
            echo "::error::world_id must be 'live' or a UUID"
            exit 1
          fi
          if [ -n "$CODE" ] && ! [[ "$CODE" =~ ^[A-Z]{3}$ ]]; then
            echo "::error::country_code must be a 3-letter ISO code (e.g. IND)"
            exit 1
          fi
          if [ -z "${WORKER_URL:-}" ] || [ -z "${WORKER_SECRET:-}" ]; then
            echo "::error::WORKER_URL and WORKER_SECRET secrets must be set"
            exit 1
          fi

          echo "world=$WORLD" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Resolve country list
        id: countries
        env:
          WORLD: ${{ steps.inputs.outputs.world }}
          CODE: ${{ steps.inputs.outputs.code }}
        run: |
          set -euo pipefail
          if [ -n "$CODE" ]; then
            CODES="$CODE"
          else
            STATUS=$(curl -sS -o countries.json -w '%{http_code}' \
              -H "x-worker-secret: $WORKER_SECRET" \
              --get --data-urlencode "world_id=$WORLD" \
              "$WORKER_URL/api/countries") || STATUS=000
            if [ "$STATUS" != "200" ]; then
              echo "::error::GET /api/countries returned HTTP $STATUS: $(head -c 300 countries.json 2>/dev/null || true)"
              exit 1
            fi
            # Only well-formed ISO3 codes go any further.
            CODES=$(jq -r '.codes[]? // empty' countries.json | grep -E '^[A-Z]{3}$' || true)
          fi

          if [ -z "$CODES" ]; then
            echo "::error::No countries found in world $WORLD — is the DB seeded?"
            exit 1
          fi
          echo "Found $(echo "$CODES" | wc -l | tr -d ' ') countries to sync."
          {
            echo "codes<<CODES_EOF"
            echo "$CODES"
            echo "CODES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sync countries sequentially
        env:
          WORLD: ${{ steps.inputs.outputs.world }}
          CODES: ${{ steps.countries.outputs.codes }}
        run: |
          set -uo pipefail

          # POST a JSON body; sets STATUS (HTTP code, 000 on transport failure) and RESP.
          post() {
            local path="$1" body="$2"
            STATUS=$(curl -sS -o resp.json -w '%{http_code}' --max-time 120 -X POST \
              -H "x-worker-secret: $WORKER_SECRET" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "$WORKER_URL$path") || STATUS=000
            RESP=$(cat resp.json 2>/dev/null || true)
          }

          # Success = HTTP 2xx AND a JSON body without an "error" field.
          ok() {
            [[ "$STATUS" =~ ^2[0-9][0-9]$ ]] || return 1
            echo "$RESP" | jq -e 'type == "object" and (has("error") | not)' > /dev/null 2>&1
          }

          TOTAL=0
          SYNC_FAILED=0
          AGENT_FAILED=0
          AGENT_SKIPPED=0
          FAILED_CODES=""

          while IFS= read -r CODE; do
            [ -z "$CODE" ] && continue
            [[ "$CODE" =~ ^[A-Z]{3}$ ]] || { echo "Skipping malformed code"; continue; }
            TOTAL=$((TOTAL + 1))
            echo "::group::[$TOTAL] $CODE"
            BODY=$(jq -cn --arg c "$CODE" --arg w "$WORLD" '{country_code: $c, world_id: $w}')

            # --- Sync: real-world news → divergence (applied in place to the current sim year) ---
            post /api/sync/country "$BODY"
            if ok; then
              echo "sync: $(echo "$RESP" | jq -r '"diverged=\(.diverged) — \((.explanation // "")[0:80])"')"
            else
              echo "::warning::$CODE sync failed (HTTP $STATUS): $(echo "$RESP" | head -c 300)"
              SYNC_FAILED=$((SYNC_FAILED + 1))
              FAILED_CODES="$FAILED_CODES $CODE(sync)"
            fi

            # --- Agent: one annual step (the live world skips until a new real year starts) ---
            post /api/agents/run "$BODY"
            if ok; then
              if [ "$(echo "$RESP" | jq -r '.skipped // false')" = "true" ]; then
                AGENT_SKIPPED=$((AGENT_SKIPPED + 1))
                echo "agent: skipped — $(echo "$RESP" | jq -r '.reason // ""')"
              else
                echo "agent: success"
              fi
            else
              echo "::warning::$CODE agent failed (HTTP $STATUS): $(echo "$RESP" | head -c 300)"
              AGENT_FAILED=$((AGENT_FAILED + 1))
              FAILED_CODES="$FAILED_CODES $CODE(agent)"
            fi

            echo "::endgroup::"

            # Respect Groq rate limit (30 rpm) — 2 LLM calls per country = 15 countries/min max.
            # Sleep 4s between countries keeps us under the limit with headroom.
            sleep 4
          done <<< "$CODES"

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Monthly sync complete"
          echo "Countries:      $TOTAL"
          echo "Sync failures:  $SYNC_FAILED"
          echo "Agent failures: $AGENT_FAILED"
          echo "Agent skipped:  $AGENT_SKIPPED (live world already at the current real year)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          {
            echo "### Monthly sync"
            echo "| Countries | Sync failures | Agent failures | Agent skipped |"
            echo "|---|---|---|---|"
            echo "| $TOTAL | $SYNC_FAILED | $AGENT_FAILED | $AGENT_SKIPPED |"
            [ -n "$FAILED_CODES" ] && echo "" && echo "Failed:$FAILED_CODES"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $((SYNC_FAILED + AGENT_FAILED)) -gt 0 ]; then
            echo "::error::$((SYNC_FAILED + AGENT_FAILED)) call(s) failed:$FAILED_CODES"
            exit 1
          fi
