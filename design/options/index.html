<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RealityShift Brand Options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#F4F3EF;--ink:#15171C;--mute:#5D6068}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101114;--ink:#ECEAE4;--mute:#9A9CA3}}
:root[data-theme="dark"]{--bg:#101114;--ink:#ECEAE4;--mute:#9A9CA3}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Space Grotesk',sans-serif}
main{max-width:1400px;margin:0 auto;padding:40px 16px}
h1{font-size:32px;margin:0 0 6px}p{color:var(--mute);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,640px),1fr));gap:28px}
figure{margin:0}iframe{width:100%;aspect-ratio:16/10;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent);border-radius:6px;background:#000}
figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-weight:700}figcaption a{color:inherit}figcaption span{color:var(--mute);font-weight:500}
</style></head><body><main>
<h1>RealityShift: four brand directions</h1><p>Each one shows the globe screen with real copy from the app. Open any of them full size to see it at desktop and phone widths.</p>
<div class="grid">
<figure><iframe src="option-1-arcade-cartography.html" title="Option 1" loading="lazy"></iframe><figcaption><a href="option-1-arcade-cartography.html">1 · Arcade Cartography</a><span>Board-game map, energy 4</span></figcaption></figure>
<figure><iframe src="option-2-parallel-press.html" title="Option 2" loading="lazy"></iframe><figcaption><a href="option-2-parallel-press.html">2 · Parallel Press</a><span>Broadsheet, energy 3</span></figcaption></figure>
<figure><iframe src="option-3-fork-signal.html" title="Option 3" loading="lazy"></iframe><figcaption><a href="option-3-fork-signal.html">3 · Fork Signal</a><span>Split reality, energy 5</span></figcaption></figure>
<figure><iframe src="option-4-situation-room.html" title="Option 4" loading="lazy"></iframe><figcaption><a href="option-4-situation-room.html">4 · Situation Room</a><span>Command centre, energy 2</span></figcaption></figure>
</div></main></body></html>
