<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=JetBrains+Mono:wght@700&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:linear-gradient(90deg,#123B49 0 50%,#4A1F2A 50%);font-family:Fredoka}
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff1c 1.5px,transparent 1.5px);background-size:22px 22px}
.g{position:absolute;top:140px;width:290px;height:290px;border-radius:50%;border:5px solid #0B0F19;box-shadow:9px 9px 0 #0B0F19;background:url(../../public/earth-cartoon.jpg) 14% 36%/240% auto}
.g1{left:140px}.g2{left:770px;filter:hue-rotate(-35deg) saturate(1.5)}
.chip{position:absolute;top:118px;font:700 18px 'JetBrains Mono';letter-spacing:.1em;padding:6px 14px;border:3px solid #0B0F19;border-radius:10px;box-shadow:3px 3px 0 #0B0F19;color:#0B0F19}
.c1{left:140px;background:#21B8A6}.c2{left:770px;background:#FF6B3D}
.wm{position:absolute;left:0;right:0;top:34px;text-align:center;font:700 64px/1 Fredoka;color:#FFD60A;-webkit-text-stroke:2.5px #0B0F19;paint-order:stroke fill;text-shadow:5px 5px 0 #0B0F19}
.wm b{color:#FF6B3D}
.h{position:absolute;left:0;right:0;bottom:44px;text-align:center;font:700 54px/1.05 Fredoka;color:#fff;-webkit-text-stroke:2px #0B0F19;paint-order:stroke fill;text-shadow:4px 4px 0 #0B0F19}
.h em{font-style:normal;color:#FF6B3D}
</style></head><body>
<div class="wm">Reality<b>/</b>Shift</div>
<span class="chip c1">REALITY</span><span class="chip c2">YOUR FORK</span>
<div class="g g1"></div><div class="g g2"></div>
<div class="h">One world is real.<br><em>The other one is yours.</em></div>
</body></html>
